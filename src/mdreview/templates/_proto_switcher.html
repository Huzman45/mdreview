{# PROTOTYPE — deliberately looks nothing like the design being judged. #}
<div class="proto-switcher" role="group" aria-label="Prototype variant">
  <a class="proto-arrow" href="?variant={{ variant_prev }}" aria-label="Previous variant">←</a>
  <span class="proto-label"><b>{{ variant }}</b> — {{ variant_name }}</span>
  <a class="proto-arrow" href="?variant={{ variant_next }}" aria-label="Next variant">→</a>
</div>

<script>
  // ← / → cycle variants, unless a field has focus.
  document.addEventListener("keydown", function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    var el = document.activeElement;
    if (el && el.closest("input, textarea, select, [contenteditable]")) return;
    if (event.key === "ArrowLeft") location.search = "?variant={{ variant_prev }}";
    if (event.key === "ArrowRight") location.search = "?variant={{ variant_next }}";
  });
</script>

<style>
  .proto-switcher {
    position: fixed;
    z-index: 999;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.3rem 0.45rem;
    border-radius: 999px;
    background: #101318;
    border: 1px solid #333b47;
    box-shadow: 0 8px 30px rgb(0 0 0 / 0.35);
    font: 500 0.78rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e6e9ee;
  }
  .proto-label { padding: 0 0.5rem; white-space: nowrap; }
  .proto-label b { color: #ffd479; }
  .proto-arrow {
    display: grid;
    place-items: center;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 999px;
    background: #1c212a;
    color: #e6e9ee;
    text-decoration: none;
  }
  .proto-arrow:hover { background: #2b323d; }
</style>
