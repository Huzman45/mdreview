<aside class="sidebar" id="sidebar">
  {% include "_decision.html" %}

  {% if can_edit %}
  <form class="comment-panel" id="comment-panel"
        hx-post="/d/{{ slug }}/v/{{ version.n }}/comments"
        hx-target="#sidebar" hx-swap="outerHTML">
    <div class="panel-head">
      <span id="selection-label" class="selection-label">Select a block</span>
    </div>
    <input type="hidden" name="line_start" id="line_start" value="">
    <input type="hidden" name="line_end" id="line_end" value="">
    <textarea name="body" id="comment-body" rows="3"
              placeholder="Select a block above, then write your comment…"
              disabled></textarea>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <button type="submit" id="comment-submit" disabled>Comment</button>
  </form>
  {% endif %}

  {% include "_comments.html" %}
</aside>
